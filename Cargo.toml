[package]
name = "webgpu"
version = "0.1.0"
edition = "2024"
description = "Rust WebGPU/wgpu examples inspired by Sascha Willems' Vulkan examples."
license = "MIT"

[[bin]]
name = "serve"
path = "src/main.rs"

# Examples default to `test = false`, which meant the tests living in these
# two were compiled but never run by `cargo test`. Opt them in explicitly.
[[example]]
name = "residentevil2"
path = "examples/residentevil2.rs"
test = true

[[example]]
name = "nanite"
path = "examples/nanite.rs"
test = true

[dependencies]
base64 = { version = "0.23.1" }
bvh = { version = "0.12.0", default-features = false, features = ["std"] }
bytes = { version = "1.12.1" }
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = { version = "0.36.2", default-features = false }
egui-wgpu = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false }
gltf = { version = "1.4.1", default-features = false, features = [
    "KHR_materials_pbrSpecularGlossiness",
    "names",
    "utils",
] }
http = { version = "1.5.0" }
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
] }
# bvh 0.12 links nalgebra 0.34, and accel.rs hands Point3 values straight to
# the bvh builder, so it must use that exact version — a newer nalgebra's
# Point3 is a distinct type and will not coerce.
nalgebra034 = { package = "nalgebra", version = "0.34.0", default-features = false, features = [
    "std",
] }
# Pinned to an exact revision, the same one the pooya.ai site builds against.
# Left floating, any `cargo update` moves sib to its newest commit and takes
# wgpu and glam across whatever breaking changes landed there.
sib = { git = "https://github.com/PooyaEimandar/sib", rev = "0e023300e80c89bc6247f8ed7a9b498c7653a707", features = [
    "render",
] }
rapier3d = "0.36.0"

# egui-winit 0.36 does not compile for wasm32, and wgpu 30 needs egui 0.36.
# This is the published 0.36.2 with a one-method fix; vendor/egui-winit/
# README.vendored.md has the details and says when it can be deleted.
[patch.crates-io]
egui-winit = { path = "vendor/egui-winit" }

# Just for Rapier Physics Engine, because it is generic-heavy
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bvh = { version = "0.12.0", default-features = false, features = [
    "rayon",
    "std",
] }
serde_json = { version = "1.0.151" }
sib = { git = "https://github.com/PooyaEimandar/sib", rev = "0e023300e80c89bc6247f8ed7a9b498c7653a707", features = [
    "net-file-server",
    "net-h1-server",
    "render",
] }
ureq = { version = "3.4.2" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2" }
objc2 = { version = "0.6.4", features = [
    "disable-encoding-assertions",
    "exception",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSBitmapImageRep",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "objc2-core-graphics",
    "std",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSError",
    "NSObject",
    "NSString",
    "std",
] }
# htmlmesh's native webview. Kept macOS-only: the snapshot path that turns the
# live page into a texture is WKWebView-specific, so on other platforms wry
# could open a page but never render one -- while on Linux it binds WebKitGTK
# and drags glib, gtk, webkit2gtk and libsoup into every build, including CI.
wry = { version = "0.57.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.106" }
wasm-bindgen = { version = "0.2.129" }
wasm-bindgen-futures = { version = "0.4.79" }
web-sys = { version = "0.3.106", features = [
    "Blob",
    "BlobPropertyBag",
    "console",
    "Document",
    "Element",
    "ErrorEvent",
    "HtmlElement",
    "MessageEvent",
    "Navigator",
    "Node",
    "Response",
    "Url",
    "Window",
    "Worker",
] }
