[package]
name = "webgpu"
version = "0.1.0"
edition = "2024"
description = "Rust WebGPU/wgpu examples inspired by Sascha Willems' Vulkan examples."
license = "MIT"

[[bin]]
name = "serve"
path = "src/main.rs"

# Examples default to `test = false`, which meant the tests living in these
# two were compiled but never run by `cargo test`. Opt them in explicitly.
[[example]]
name = "residentevil2"
path = "examples/residentevil2.rs"
test = true

[[example]]
name = "nanite"
path = "examples/nanite.rs"
test = true

[dependencies]
base64 = { version = "0.22.1" }
bvh = { version = "0.12.0", default-features = false, features = ["std"] }
bytes = { version = "1.12.1" }
bytemuck = { version = "1.25.2", features = ["derive"] }
egui = { version = "0.35.0", default-features = false }
egui-wgpu = { version = "0.35.0", default-features = false }
egui-winit = { version = "0.35.0", default-features = false }
gltf = { version = "1.4.1", default-features = false, features = [
    "KHR_materials_pbrSpecularGlossiness",
    "names",
    "utils",
] }
http = { version = "1.4.2" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# bvh 0.12 links nalgebra 0.34, and accel.rs hands Point3 values straight to
# the bvh builder, so it must use that exact version — a newer nalgebra's
# Point3 is a distinct type and will not coerce.
nalgebra034 = { package = "nalgebra", version = "0.34.0", default-features = false, features = [
    "std",
] }
sib = { git = "https://github.com/PooyaEimandar/sib", features = ["render"] }
rapier3d = "0.34.0"

# Just for Rapier Physics Engine, because it is generic-heavy
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bvh = { version = "0.12.0", default-features = false, features = [
    "rayon",
    "std",
] }
serde_json = { version = "1.0.151" }
sib = { git = "https://github.com/PooyaEimandar/sib", features = [
    "net-file-server",
    "net-h1-server",
    "render",
] }
ureq = { version = "3.3.0" }
wry = { version = "0.55.1" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6.2" }
objc2 = { version = "0.6.4", features = [
    "disable-encoding-assertions",
    "exception",
] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "NSBitmapImageRep",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "objc2-core-graphics",
    "std",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "NSData",
    "NSError",
    "NSObject",
    "NSString",
    "std",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "0.3.103" }
wasm-bindgen = { version = "0.2.126" }
wasm-bindgen-futures = { version = "0.4.76" }
web-sys = { version = "0.3.103", features = [
    "Blob",
    "BlobPropertyBag",
    "console",
    "Document",
    "Element",
    "ErrorEvent",
    "HtmlElement",
    "MessageEvent",
    "Navigator",
    "Node",
    "Response",
    "Url",
    "Window",
    "Worker",
] }
