name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep CI lean: the dev profile here builds dependencies at opt-level 3 for
  # Rapier, which is wasted work when nothing is being run for performance.
  CARGO_PROFILE_DEV_OPT_LEVEL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: rustup component add rustfmt clippy

      # winit and wgpu link against the system windowing stack, which the test
      # binaries need even though CI never opens a window.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxrandr-dev libxi-dev libxcursor-dev libgl1-mesa-dev \
            libasound2-dev libudev-dev pkg-config cmake

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      # The Pages workflow gates its deploy on these, but only on a push to
      # main — so a broken gallery/metadata pairing was only discovered at
      # deploy time. Run them here too, on every PR.
      - name: Web metadata and sitemap
        run: |
          python3 scripts/test-render-example.py
          python3 scripts/test-render-sitemap.py
